name: Зібрати APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Nebo.apk && cp sunrise/build/outputs/apk/debug/sunrise-debug.apk Svitanok.apk && cp vikno/build/outputs/apk/debug/vikno-debug.apk Vikno.apk && cp pisok/build/outputs/apk/debug/pisok-debug.apk Pisok.apk && cp ruina/build/outputs/apk/debug/ruina-debug.apk Ruina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nebo-apk
          path: |
            Nebo.apk
            Svitanok.apk
            Vikno.apk
            Pisok.apk
            Ruina.apk
      - name: Опублікувати за постійним посиланням
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" Nebo.apk Svitanok.apk Vikno.apk Pisok.apk Ruina.apk \
            --title "Небо 1.${{ github.run_number }}" \
            --notes "Nebo.apk: «Небо». Svitanok.apk: світанковий будильник. Vikno.apk: «Вікно», живий пейзаж, що щоранку покращується. Pisok.apk: «Пісочниця», живі матеріали під пальцями. Ruina.apk: «Руйнівник», 3D-гра про руйнування споруд. Встановлюйте поверх попередніх версій." --latest
