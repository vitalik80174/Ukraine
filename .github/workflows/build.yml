name: Зібрати APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Nebo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nebo-apk
          path: Nebo.apk
      - name: Опублікувати за постійним посиланням
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" Nebo.apk \
            --title "Небо 1.${{ github.run_number }}" \
            --notes "Встановіть поверх попередньої версії." --latest
