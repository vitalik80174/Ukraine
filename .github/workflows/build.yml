name: Зібрати APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - name: Зібрати APK і список застосунків
        run: |
          grep -v '^#' apps.list | grep -v '^\s*$' | while IFS='|' read -r mod pkg apk name about; do
            cp "$mod/build/outputs/apk/debug/$mod-debug.apk" "$apk"
          done
          python3 tools/apps.py > apps.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nebo-apk
          path: |
            *.apk
            apps.json
      - name: Опублікувати за постійним посиланням
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(grep -v '^#' apps.list | grep -v '^\s*$' | cut -d'|' -f3 | tr '\n' ' ')
          notes=$(grep -v '^#' apps.list | grep -v '^\s*$' | awk -F'|' '{printf "%s: «%s», %s. ", $3, $4, $5}')
          gh release create "v1.${{ github.run_number }}" $files apps.json \
            --title "Небо 1.${{ github.run_number }}" \
            --notes "${notes}Встановлюйте поверх попередніх версій — або поставте Onovlennia.apk, і воно оновлюватиме все саме." --latest
