<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Руйнівник</title>
<style>
/* Руйнівник: full-screen 3D canvas; HUD floats on top; menu and results are centred cards over a dimmed scene. */
:root{
  --fg:#fbf6ee; --dim:rgba(251,246,238,.66); --panel:rgba(20,22,30,.82); --line:rgba(255,255,255,.14);
  --hot:#ff7a2f; --gold:#ffcf4a; --ok:#6ee7a0;
  --f:"Golos Text","Roboto",system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font:15px/1.4 var(--f);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.meter{padding:10px 14px;min-width:min(320px,60vw);pointer-events:auto}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.meter b{font-weight:600}
.meter #pct{font:700 22px/1 var(--f);font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:8px;overflow:visible}
#fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--hot),var(--gold));transition:background .3s}
#fill.won{background:linear-gradient(90deg,#3fbf7f,var(--ok))}
#goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-radius:1px}
.icons{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.icon{width:46px;height:46px;border-radius:14px;font-size:20px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel)}
.weapons{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px}
.wpn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:8px 10px;border-radius:14px;border:1px solid transparent;background:none;position:relative}
.wpn b{font-size:24px;line-height:26px;font-weight:400}
.wpn span{font-size:12px;color:var(--dim)}
.wpn em{position:absolute;top:4px;right:6px;font:700 12px var(--f);font-style:normal;color:var(--gold)}
.wpn.on{background:rgba(255,122,47,.18);border-color:var(--hot)}
.wpn.on span{color:var(--fg)}
.wpn.empty{opacity:.4}
.toast{position:fixed;top:max(84px,calc(env(safe-area-inset-top) + 72px));left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;font-size:13.5px;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;text-align:center;pointer-events:none;line-height:1.6}

/* menu */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,12,20,.35),rgba(10,12,20,.75));overflow:auto}
.menu{width:min(860px,100%);display:flex;flex-direction:column;gap:14px}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title h1{font:800 clamp(34px,7vw,64px)/.95 var(--f);letter-spacing:-.02em;margin:0;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.title h1 span{color:var(--hot)}
.title p{margin:6px 0 0;color:var(--dim)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lvl{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);position:relative;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lvl:focus-visible{outline:2px solid var(--gold)}
.lvl .n{font:700 12px var(--f);color:var(--hot);letter-spacing:.08em}
.lvl b{font:700 19px/1.15 var(--f)}
.lvl .d{color:var(--dim);font-size:13px;min-height:2.6em}
.lvl.locked{opacity:.45}
.st i,.stars i{font-style:normal;color:rgba(255,255,255,.22)}
.st i.on,.stars i.on{color:var(--gold)}
.st{font-size:18px;letter-spacing:2px}
.free{padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.free b{margin-right:4px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 12px;font-size:13.5px}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:13.5px}
.opts label{display:flex;gap:6px;align-items:center}
.opts .chip{margin-left:auto;color:var(--fg)}

/* result */
.result{width:min(400px,100%);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result h2{font:800 30px/1 var(--f);margin:0}
.result .big{font:800 54px/1 var(--f);color:var(--gold)}
.stars{font-size:38px;letter-spacing:6px}
.result p{margin:0;color:var(--dim)}
.btns{display:flex;gap:8px;width:100%;margin-top:6px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;background:var(--hot);color:#1d0e05}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--line)}

.icon.off{opacity:.35}
.btn.replay{width:100%;margin-top:4px;background:rgba(255,207,74,.12);color:var(--gold);border:1px solid rgba(255,207,74,.45)}

/* slow-motion replay: cinema bars, a blinking REC dot, speed and progress */
#replay{position:fixed;inset:0;pointer-events:none}
#replay .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));opacity:0;transition:opacity .6s}
#replay.slow .vig{opacity:1}
.lb{position:absolute;left:0;right:0;height:max(56px,10vh);background:#050507;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(22px,env(safe-area-inset-left));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lb.t{top:0;transform:translateY(-100%)} .lb.b{bottom:0;transform:translateY(100%)}
#replay.in .lb{transform:none}
.rec{font:700 15px var(--f);letter-spacing:.32em;display:flex;align-items:center;gap:10px}
.rec i{width:11px;height:11px;border-radius:50%;background:#ff3b30;box-shadow:0 0 12px #ff3b30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.spd{font:700 22px/1 var(--f);font-variant-numeric:tabular-nums;color:var(--dim);transition:color .3s}
#replay.slow .spd{color:var(--gold)}
.rpbar{flex:1;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
#rpFill{height:100%;width:0;background:var(--hot)}
.skip{pointer-events:auto;color:var(--fg)}

/* diary */
.diary{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);padding:max(20px,env(safe-area-inset-top)) 20px 20px;background:rgba(16,18,26,.94);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.diary.open{transform:none}
.diary h2{margin:0 0 8px;font:700 22px var(--f)}
.diary .list{overflow:auto;flex:1}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry .d{color:var(--hot);font-size:12px;font-weight:700;letter-spacing:.04em}
.entry b{display:block}
.entry p{margin:6px 0 0;color:var(--dim);font-size:13.5px}
.diary .x{position:absolute;top:max(12px,env(safe-area-inset-top));right:10px;background:none;border:0;font-size:26px;color:var(--dim);padding:6px 10px}
.ver{color:var(--dim);font-size:11.5px;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="card meter">
      <div class="row"><b id="lvname">Рівень</b><span id="pct">0%</span></div>
      <div class="bar"><div id="fill"></div><div id="goal" title="Мета"></div></div>
    </div>
    <div class="icons">
      <button class="icon off" id="btnReplay" aria-label="Повтор у сповільненій зйомці">▶</button>
      <button class="icon" id="btnRestart" aria-label="Почати рівень заново">↺</button>
      <button class="icon" id="btnMenu" aria-label="Меню">☰</button>
    </div>
  </div>
  <div class="card weapons" id="weapons" role="toolbar" aria-label="Зброя"></div>
</div>
<div class="card toast" id="toast" style="opacity:0"></div>
<div class="card hint" id="hint" hidden><b>Тягніть</b> пальцем — обертати камеру<br><b>Двома пальцями</b> — наблизити<br><b>Торкніться</b> — стріляти</div>

<div class="screen" id="menu">
  <div class="menu">
    <div class="title">
      <div><h1>Руйнів<span>ник</span></h1><p>Будівлі з тисяч блоків і чесна фізика. Знайдіть слабке місце.</p></div>
    </div>
    <div class="levels" id="levels"></div>
    <div class="card free"><b>Вільний режим</b><span style="color:var(--dim);font-size:13px">без обмежень набоїв:</span><span id="freeList" style="display:contents"></span></div>
    <div class="opts">
      <label><input type="checkbox" id="optSound"> Звук</label>
      <label><input type="checkbox" id="optVibro"> Вібрація</label>
      <button class="chip" id="btnDiary">Щоденник змін</button>
    </div>
  </div>
</div>

<div class="screen" id="result" hidden>
  <div class="card result">
    <h2 id="rTitle">Є!</h2>
    <div class="big" id="rPct">0%</div>
    <div class="stars" id="rStars"></div>
    <p id="rText"></p>
    <button class="btn replay" id="rReplay">▶&nbsp; Подивитися повтор</button>
    <div class="btns">
      <button class="btn ghost" id="rMenu">Рівні</button>
      <button class="btn ghost" id="rAgain">Ще раз</button>
      <button class="btn" id="rNext">Далі</button>
    </div>
  </div>
</div>

<div id="replay" hidden>
  <div class="vig"></div>
  <div class="lb t"><span class="rec"><i></i>ПОВТОР</span><span class="spd" id="rpSpeed">×1,0</span></div>
  <div class="lb b"><div class="rpbar"><div id="rpFill"></div></div><button class="chip skip" id="rpSkip">Пропустити ✕</button></div>
</div>

<aside class="diary" id="diary" aria-label="Щоденник змін">
  <button class="x" id="closeDiary" aria-label="Закрити">×</button>
  <h2>Щоденник змін</h2>
  <div class="list" id="diaryList"></div>
  <div class="ver" id="ver">Лабораторія Claude</div>
</aside>

<script src="changelog.js"></script>
<script src="game.js"></script>
</body>
</html>
