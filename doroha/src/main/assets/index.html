<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#25221f"><title>Дорога — мандрівка на фургоні</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151d23;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bottom{justify-content:space-between;align-items:end}button{pointer-events:auto;background:#1b242bd9;border:1px solid #ffffff55;border-radius:13px;color:white;padding:12px 16px;font:600 15px system-ui;box-shadow:0 3px 12px #0004}button:active,button.active{background:#d68542;color:#21160e}.panel{background:#172127c9;border:1px solid #ffffff35;border-radius:14px;padding:10px 14px;text-shadow:0 1px 2px #000}.title{font-size:17px;font-weight:750;letter-spacing:.04em}.small{font-size:12px;color:#e9e2d9}.steer{font-size:24px;min-width:64px;touch-action:none}#notice{position:absolute;left:50%;top:16%;transform:translateX(-50%);background:#202a2edb;border-radius:12px;padding:10px 16px;text-align:center;transition:opacity 1s;pointer-events:none;max-width:85%;font-size:14px}
dialog{background:#242c30;color:#f5e8d7;border:1px solid #b5906d;border-radius:16px;max-width:520px;max-height:80vh;overflow:auto;padding:24px}dialog::backdrop{background:#0009}dialog p{line-height:1.6}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="row"><div class="panel"><div class="title">ДОРОГА <span style="font-weight:400"> / Chevy Van</span></div><div class="small" id="status"></div></div><button id="view">🚪 У салон</button><button id="land">🗺 Маршрут</button><button id="time">☀️ День</button><button id="journal">Щоденник</button></div><div class="row bottom"><div class="row" id="steering"><button class="steer" id="left">◀</button><button class="steer" id="right">▶</button></div><div class="row"><button id="action">⏸ Зупинитись</button></div></div></div><div id="notice">Від Тихого океану до Атлантики. Керуй стрілками; кнопка «Маршрут» переносить до наступного краю.</div><dialog id="changes"><h2>Щоденник змін</h2><div id="entries"></div><button id="closeJournal">Повернутися</button></dialog><script src="changelog.js"></script><script src="doroha.js"></script></body></html>
