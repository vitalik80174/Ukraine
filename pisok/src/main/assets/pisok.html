<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Пісочниця</title>
<style>
/* Пісочниця: the world fills the screen; a floating palette sits at the bottom; a diary panel slides in from the right. */
:root{
  --fg:#f3efe6; --dim:rgba(243,239,230,.62); --panel:rgba(16,18,26,.9); --line:rgba(255,255,255,.12); --accent:#e8c077;
  --f:"Golos Text","Roboto",system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#11131b;color:var(--fg);font:14px/1.4 var(--f);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:20px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.mat,.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:7px 6px 6px;border-radius:14px;border:1px solid transparent;background:none;color:var(--dim);font:500 11.5px var(--f);cursor:pointer}
.mat i{width:24px;height:24px;border-radius:8px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.mat.on{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:var(--fg)}
.tool b{font:600 18px/24px var(--f);height:24px;color:var(--fg)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;flex:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;color:var(--dim);transition:opacity .5s;pointer-events:none;white-space:nowrap}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 20px 20px}
.panel.open{transform:none}
.panel h1{font:600 24px/1.1 var(--f);margin:0}
.panel .sub{color:var(--dim);font-size:13px;margin-top:4px}
.panel h2{font:600 11px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px}
.how{color:var(--dim);font-size:13.5px;margin:0;padding-left:18px}
.how li{margin:3px 0}
.diary{overflow:auto;flex:1}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry .d{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.04em}
.entry b{display:block;font-weight:600}
.entry p{margin:6px 0 0;color:var(--dim);font-size:13.5px}
.close{position:absolute;top:max(14px,env(safe-area-inset-top));right:12px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;padding:6px 10px;line-height:1}
.foot{color:var(--dim);font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="bar" role="toolbar" aria-label="Матеріали"></div>
<div class="toast" id="toast" style="opacity:0"></div>

<aside class="panel" id="panel" aria-label="Меню">
  <button class="close" id="close" aria-label="Закрити">×</button>
  <h1>Пісочниця</h1>
  <div class="sub" id="dayline">Світ із живих матеріалів</div>
  <h2>Що з чим буває</h2>
  <ul class="how">
    <li>Вода + рослина → рослина росте</li>
    <li>Вогонь + рослина → пожежа і дим</li>
    <li>Вода + вогонь → пара</li>
    <li>Лава + вода → камінь і пара</li>
    <li>Пара під стелею → дощ</li>
    <li>Сніг біля вогню → тане</li>
  </ul>
  <h2>Щоденник змін</h2>
  <div class="diary" id="diary"></div>
  <div class="foot" id="foot">Лабораторія Claude</div>
</aside>

<script src="changelog.js"></script>
<script>
"use strict";
const app = window.Pisok || null;
const store = {
  get(k,d){ try{ const v=localStorage.getItem("pisok."+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("pisok."+k, JSON.stringify(v)); }catch(e){} }
};

/* ============ materials ============ */
const E=0, SAND=1, WATER=2, STONE=3, FIRE=4, PLANT=5, LAVA=6, STEAM=7, SNOW=8, SMOKE=9;
const DENS = [0, 3, 1, 9, .3, 9, 1.6, .2, 1.4, .1];
const FLUID = [true,false,true,false,true,false,true,true,false,true]; // things others may sink/rise through
const MATS = [
  {id:SAND,  name:"Пісок",    col:[232,192,119], v:18, fill:.35},
  {id:WATER, name:"Вода",     col:[62,143,214],  v:10, fill:.5},
  {id:PLANT, name:"Рослина",  col:[93,176,90],   v:26, fill:.6},
  {id:FIRE,  name:"Вогонь",   col:[255,138,61],  v:0,  fill:.5},
  {id:LAVA,  name:"Лава",     col:[255,96,36],   v:24, fill:.5},
  {id:SNOW,  name:"Сніг",     col:[238,244,255], v:8,  fill:.25},
  {id:STONE, name:"Камінь",   col:[92,96,110],   v:12, fill:1},
  {id:STEAM, name:"Пара",     col:[205,214,228], v:8,  fill:.4},
  {id:E,     name:"Гумка",    col:[40,44,58],    v:0,  fill:1}
];
const BASE=[]; MATS.forEach(m=>BASE[m.id]=m); BASE[SMOKE]={col:[74,74,84],v:10};

/* ============ world ============ */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let GW=0, GH=0, CELL=4, T, S, L, M, img, buf, bg, off, offCtx;
const rnd=Math.random;
function makeWorld(){
  const w=innerWidth, h=innerHeight;
  CELL=Math.max(3, Math.floor(Math.min(w,h)/170));
  GW=Math.ceil(w/CELL); GH=Math.ceil(h/CELL);
  T=new Uint8Array(GW*GH); S=new Uint8Array(GW*GH); L=new Uint16Array(GW*GH); M=new Uint8Array(GW*GH);
  off=document.createElement("canvas"); off.width=GW; off.height=GH; offCtx=off.getContext("2d");
  img=offCtx.createImageData(GW,GH); buf=new Uint32Array(img.data.buffer);
  bg=new Uint32Array(GH);
  for(let y=0;y<GH;y++){ const t=y/GH; bg[y]=pack(lerp(14,24,t),lerp(16,22,t),lerp(26,30,t)); }
  cv.width=GW; cv.height=GH;
}
const lerp=(a,b,t)=>a+(b-a)*t;
function pack(r,g,b){ return (255<<24)|((b&255)<<16)|((g&255)<<8)|(r&255); }

function put(i,t){ T[i]=t; S[i]=(rnd()*256)|0; L[i]= t===FIRE?40+rnd()*50 : t===STEAM?160+rnd()*200 : t===SMOKE?40+rnd()*60 : 0; }
const at=(x,y)=> (x<0||y<0||x>=GW||y>=GH) ? STONE : T[y*GW+x];
function swap(i,j){
  const t=T[i]; T[i]=T[j]; T[j]=t; const s=S[i]; S[i]=S[j]; S[j]=s; const l=L[i]; L[i]=L[j]; L[j]=l;
  M[i]=1; M[j]=1;
}
function sinks(t, x, y){ // can a falling t move into (x,y)?
  if (x<0||x>=GW||y<0||y>=GH) return false;
  const u=T[y*GW+x]; return u===E || (FLUID[u] && DENS[t]>DENS[u]);
}
function rises(x, y){ // can a gas move into (x,y)?
  if (x<0||x>=GW||y<0||y>=GH) return false;
  const u=T[y*GW+x]; return u===E || u===WATER || u===LAVA;
}

/* ============ simulation ============ */
let frame=0, paused=false;
function step(){
  M.fill(0); frame++;
  const ltr=frame&1;
  for(let y=GH-1;y>=0;y--){
    for(let k=0;k<GW;k++){
      const x=ltr?k:GW-1-k, i=y*GW+x, t=T[i];
      if (t===E || t===STONE || M[i]) continue;
      switch(t){
        case SAND: powder(i,x,y,t, .5); break;
        case SNOW: snow(i,x,y); break;
        case WATER: water(i,x,y); break;
        case LAVA: lava(i,x,y); break;
        case FIRE: fire(i,x,y); break;
        case STEAM: gas(i,x,y,true); break;
        case SMOKE: gas(i,x,y,false); break;
        case PLANT: plant(i,x,y); break;
      }
    }
  }
}
function powder(i,x,y,t,slowInFluid){
  const b=at(x,y+1);
  if (sinks(t,x,y+1)){ if (b!==E && rnd()<slowInFluid) return; swap(i,i+GW); return; }
  const d=rnd()<.5?-1:1;
  if (sinks(t,x+d,y+1) && at(x+d,y)!==STONE){ swap(i,i+GW+d); return; }
  if (sinks(t,x-d,y+1) && at(x-d,y)!==STONE){ swap(i,i+GW-d); }
}
function near(x,y,t){ return at(x+1,y)===t||at(x-1,y)===t||at(x,y+1)===t||at(x,y-1)===t; }
function snow(i,x,y){
  if (near(x,y,FIRE)||near(x,y,LAVA)){ put(i,WATER); M[i]=1; return; }
  if (rnd()<.55) return;                                 // snow drifts slowly
  const d=rnd()<.5?-1:1;
  if (sinks(SNOW,x,y+1)){ if (rnd()<.25 && sinks(SNOW,x+d,y+1)) swap(i,i+GW+d); else swap(i,i+GW); return; }
  if (sinks(SNOW,x+d,y+1)) swap(i,i+GW+d);
}
function flow(i,x,y,t,disp){
  if (sinks(t,x,y+1)){ swap(i,i+GW); return true; }
  const d=rnd()<.5?-1:1;
  if (sinks(t,x+d,y+1)){ swap(i,i+GW+d); return true; }
  if (sinks(t,x-d,y+1)){ swap(i,i+GW-d); return true; }
  for (const dir of [d,-d]){
    let last=-1;
    for(let s=1;s<=disp;s++){ const nx=x+dir*s; if (nx<0||nx>=GW||T[y*GW+nx]!==E) break; last=nx; }
    if (last>=0){ swap(i,y*GW+last); return true; }
  }
  return false;
}
function water(i,x,y){
  const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  for(const [nx,ny] of nb){ if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx;
    if (T[j]===FIRE){ put(j, rnd()<.6?STEAM:SMOKE); M[j]=1; if (rnd()<.2){ put(i,STEAM); M[i]=1; return; } }
    else if (T[j]===LAVA){ put(j,STONE); put(i,STEAM); M[i]=M[j]=1; return; } }
  flow(i,x,y,WATER,4);
}
function lava(i,x,y){
  for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){ if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx;
    if (T[j]===PLANT && rnd()<.3){ put(j,FIRE); M[j]=1; }
    else if (T[j]===SNOW){ put(j,WATER); M[j]=1; } }
  if (y>0 && T[i-GW]===E && rnd()<.004){ put(i-GW,FIRE); M[i-GW]=1; }
  if (rnd()<.35) flow(i,x,y,LAVA,2);
}
function fire(i,x,y){
  L[i] -= (at(x,y+1)===E ? 3 : 1);
  if (L[i]<=0 || L[i]>1000){ if (rnd()<.35) put(i,SMOKE); else T[i]=E; M[i]=1; return; }
  for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1],[x+1,y-1],[x-1,y-1]]){ if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx;
    if (T[j]===PLANT && rnd()<.09){ put(j,FIRE); M[j]=1; }
    else if (T[j]===SNOW && rnd()<.2){ put(j,WATER); M[j]=1; } }
  if (rnd()<.45){ const d=(rnd()*3|0)-1; const nx=x+d, ny=y-1;
    if (ny>=0 && nx>=0 && nx<GW && T[ny*GW+nx]===E) swap(i,ny*GW+nx); }
}
function gas(i,x,y,steam){
  L[i]--;
  if (L[i]<=0 || L[i]>1000){ if (steam && rnd()<.45) put(i,WATER); else T[i]=E; M[i]=1; return; }
  if (steam && y===0 && rnd()<.012){ put(i,WATER); M[i]=1; return; }   // condenses under the ceiling → rain
  const d=(rnd()*3|0)-1;
  if (rnd()<.75 && rises(x+d,y-1)) { swap(i,(y-1)*GW+x+d); return; }
  const s=rnd()<.5?-1:1; if (x+s>=0 && x+s<GW && T[i+s]===E) swap(i,i+s);
}
function plant(i,x,y){
  if (rnd()>.06) return;
  const nb=[[x,y-1],[x+1,y-1],[x-1,y-1],[x+1,y],[x-1,y],[x,y+1]];
  const [nx,ny]=nb[rnd()*nb.length|0];
  if (nx<0||ny<0||nx>=GW||ny>=GH) return; const j=ny*GW+nx;
  if (T[j]===WATER){ put(j,PLANT); M[j]=1; }
}

/* ============ drawing ============ */
function render(){
  const tick=frame;
  for(let y=0;y<GH;y++){ const row=y*GW, b=bg[y];
    for(let x=0;x<GW;x++){ const i=row+x, t=T[i];
      if (t===E){ buf[i]=b; continue; }
      const s=(S[i]-128)/128;
      let r,g,bl;
      if (t===FIRE){ const l=Math.min(1,L[i]/70); r=255; g=lerp(70,230,l)+s*20; bl=lerp(20,90,l*l); }
      else if (t===LAVA){ const f=.5+.5*Math.sin(tick*.08+S[i]*.1); r=255; g=70+f*60+s*20; bl=20+f*20; }
      else if (t===STEAM||t===SMOKE){ const c=BASE[t].col, a=Math.min(1,L[i]/(t===STEAM?120:60))*(t===STEAM?.55:.7);
        const br=b&255, bgc=(b>>8)&255, bb=(b>>16)&255; r=lerp(br,c[0],a); g=lerp(bgc,c[1],a); bl=lerp(bb,c[2],a); }
      else { const c=BASE[t].col, v=BASE[t].v; r=c[0]+s*v; g=c[1]+s*v; bl=c[2]+s*v;
        if (t===WATER){ const w=Math.sin(tick*.05+x*.3+y*.2)*6; r+=w; g+=w; bl+=w;
          if (y>0 && T[i-GW]===E){ r+=40; g+=40; bl+=30; } } }       // light surface line
      buf[i]=pack(Math.max(0,Math.min(255,r)),Math.max(0,Math.min(255,g)),Math.max(0,Math.min(255,bl)));
    }
  }
  offCtx.putImageData(img,0,0);
  ctx.drawImage(off,0,0);
}

/* ============ painting with fingers ============ */
let current=SAND, sizes=[2,4,7], sizeIx=1;
const pointers=new Map();
function stamp(cx,cy,mat){
  const r=sizes[sizeIx], fill=BASE[mat].fill ?? .5;
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if (dx*dx+dy*dy>r*r) continue; const x=cx+dx, y=cy+dy; if (x<0||y<0||x>=GW||y>=GH) continue;
    const i=y*GW+x;
    if (mat===E){ T[i]=E; continue; }
    if (T[i]!==E && mat!==STONE) continue;
    if (rnd()<fill) put(i,mat);
  }
}
function toCell(e){ return [Math.floor(e.clientX/innerWidth*GW), Math.floor(e.clientY/innerHeight*GH)]; }
function line(a,b,mat){
  const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/Math.max(1,sizes[sizeIx]*.6)));
  for(let k=0;k<=n;k++) stamp(Math.round(lerp(a[0],b[0],k/n)), Math.round(lerp(a[1],b[1],k/n)), mat);
}
cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const p=toCell(e); pointers.set(e.pointerId,p); stamp(p[0],p[1],current); });
cv.addEventListener("pointermove",e=>{ const last=pointers.get(e.pointerId); if(!last) return; const p=toCell(e); line(last,p,current); pointers.set(e.pointerId,p); });
const up=e=>pointers.delete(e.pointerId);
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);

/* ============ toolbar ============ */
const $=id=>document.getElementById(id);
const bar=$("bar");
function buildBar(){
  bar.innerHTML="";
  for(const m of MATS){
    const b=document.createElement("button"); b.className="mat"+(m.id===current?" on":""); b.setAttribute("aria-pressed", m.id===current);
    const c=m.id===E?"repeating-linear-gradient(45deg,#3a3f52 0 4px,#262a38 4px 8px)":`rgb(${m.col})`;
    b.innerHTML=`<i style="background:${c}"></i>${m.name}`;
    b.onclick=()=>{ current=m.id; buildBar(); if(app) app.tick(8); };
    bar.appendChild(b);
  }
  bar.insertAdjacentHTML("beforeend",'<span class="sep"></span>');
  const tools=[
    ["size",["•","●","⬤"][sizeIx],["Тонко","Пензель","Широко"][sizeIx],()=>{ sizeIx=(sizeIx+1)%3; buildBar(); }],
    ["pause",paused?"▶":"❚❚",paused?"Далі":"Пауза",()=>{ paused=!paused; buildBar(); toast(paused?"Світ завмер":"Світ живе"); }],
    ["clear","↺","Очистити",clearAsk],
    ["menu","⋯","Більше",()=>$("panel").classList.add("open")]
  ];
  for(const [id,icon,label,fn] of tools){ const b=document.createElement("button"); b.className="tool"; b.innerHTML=`<b>${icon}</b>${label}`; b.onclick=fn; bar.appendChild(b); }
}
let clearArmed=0;
function clearAsk(){
  if (Date.now()-clearArmed<2500){ T.fill(0); clearArmed=0; toast("Чисто"); saveWorld(); return; }
  clearArmed=Date.now(); toast("Торкніться ще раз, щоб очистити");
}
function toast(t){ const el=$("toast"); el.textContent=t; el.style.opacity=1; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.opacity=0,2200); }
$("close").onclick=()=>$("panel").classList.remove("open");

function renderDiary(){
  const log=(window.CHANGELOG||[]).slice().sort((a,b)=>b.day-a.day);
  $("diary").innerHTML=log.map(e=>`<div class="entry"><span class="d">ДЕНЬ ${e.day} · ${e.date.split("-").reverse().join(".")}</span><b>${e.title}</b><p>${e.text}</p></div>`).join("");
  if (log.length) $("dayline").textContent=`День ${log[0].day} · щоранку щось нове`;
  const v=app?app.version():""; if (v) $("foot").textContent=`Версія ${v} · Лабораторія Claude`;
  const seen=store.get("seenDay",0); if (log.length && log[0].day>seen){ store.set("seenDay",log[0].day); if (seen) setTimeout(()=>toast(`Нове: ${log[0].title}`),1200); }
}

/* ============ save / restore ============ */
function b64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
window.saveWorld=function(){ store.set("world",{w:GW,h:GH,t:b64(T)}); };
function loadWorld(){
  const w=store.get("world",null);
  if (!w || w.w!==GW || w.h!==GH) return false;
  try{ const t=unb64(w.t); for(let i=0;i<t.length;i++) if (t[i]) put(i,t[i]); return true; }catch(e){ return false; }
}
function demo(){ // a small first scene so the world is never empty on day one
  const ground=x=>Math.round(GH*(.74 - .07*Math.sin(x/GW*Math.PI*2.2+.6) - .03*Math.sin(x/GW*17)));
  for(let x=0;x<GW;x++){ for(let y=ground(x);y<GH;y++) put(y*GW+x,STONE); }
  const pool=Math.round(GW*.62);
  for(let x=pool-34;x<pool+34;x++){ const g=ground(x); for(let y=g-14;y<g+10;y++) if(y>0&&y<GH){ const i=y*GW+x; if (y<g) T[i]=E; } }
  for(let x=pool-32;x<pool+32;x++) for(let y=ground(pool)-4;y<ground(pool)+9;y++) if (T[y*GW+x]===E && rnd()<.9) put(y*GW+x,WATER);
  for(let x=Math.round(GW*.18);x<GW*.3;x++){ const h=Math.round(16-Math.abs(x-GW*.24)*.9); for(let y=ground(x)-h;y<ground(x);y++) if(y>0) put(y*GW+x,SAND); }
  for(const fx of [.4,.45,.85,.9]){ const cx=Math.round(GW*fx), g=ground(cx); // little bushes
    for(let y=g-10;y<g;y++) put(y*GW+cx,PLANT);
    for(let k=0;k<40;k++){ const a=rnd()*6.3, r=rnd()*5; const x=Math.round(cx+Math.cos(a)*r), y=Math.round(g-11+Math.sin(a)*r*.8); if(x>=0&&x<GW&&y>0&&T[y*GW+x]===E) put(y*GW+x,PLANT); } }
}

/* ============ start ============ */
function start(){ makeWorld(); if (!loadWorld()) demo(); }
let resizeT; addEventListener("resize",()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ saveWorld(); start(); },300); });
document.addEventListener("visibilitychange",()=>{ if (document.hidden) saveWorld(); });
setInterval(saveWorld, 15000);
start(); buildBar(); renderDiary();
function loop(){
  requestAnimationFrame(loop);
  for (const p of pointers.values()) stamp(p[0],p[1],current);   // holding a finger keeps pouring
  if (!paused) step();
  render();
}
requestAnimationFrame(loop);
</script>
